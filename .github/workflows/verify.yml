name: verify

on:
  push:
    branches: ["codex/develop", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  python-contracts:
    name: Python public contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-service.txt
            requirements-test.txt
      - run: python -m pip install -r requirements-service.txt -r requirements-test.txt
      - run: python -B -m pytest -q -m "not mysql_integration"

  node-state-machines:
    name: Node browser state machines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/frontend_*.test.js

  mysql-contracts:
    name: MySQL 8.4 integration contracts
    # Migration 017 intentionally requires lower_case_table_names=2. Oracle
    # MySQL does not support that mode on Linux, so this disposable service
    # must run on the same case-insensitive platform contract as production.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-service.txt
            requirements-test.txt
      - run: python -m pip install -r requirements-service.txt -r requirements-test.txt
      - name: Start disposable MySQL 8.4 and install Nginx
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install mysql@8.4 nginx
          mysql_prefix="$(brew --prefix mysql@8.4)"
          mysql_data="$RUNNER_TEMP/bfl-mysql-data"
          mysql_socket="$RUNNER_TEMP/bfl-mysql.sock"
          mysql_pid="$RUNNER_TEMP/bfl-mysql.pid"
          mysql_log="$RUNNER_TEMP/bfl-mysql.log"
          "$mysql_prefix/bin/mysqld" --no-defaults \
            --initialize-insecure \
            --datadir="$mysql_data" \
            --lower-case-table-names=2
          "$mysql_prefix/bin/mysqld" --no-defaults \
            --datadir="$mysql_data" \
            --lower-case-table-names=2 \
            --bind-address=127.0.0.1 \
            --port=3306 \
            --socket="$mysql_socket" \
            --pid-file="$mysql_pid" \
            --log-error="$mysql_log" &
          for attempt in {1..60}; do
            if "$mysql_prefix/bin/mysqladmin" \
                --host=127.0.0.1 --port=3306 --user=root ping \
                >/dev/null 2>&1; then
              break
            fi
            if ! kill -0 "$!" 2>/dev/null; then
              cat "$mysql_log"
              exit 1
            fi
            if [[ "$attempt" == 60 ]]; then
              cat "$mysql_log"
              exit 1
            fi
            sleep 1
          done
          echo "BFL_CI_MYSQL_PREFIX=$mysql_prefix" >> "$GITHUB_ENV"
          echo "BFL_CI_MYSQL_PID=$mysql_pid" >> "$GITHUB_ENV"
      - name: Bind disposable marker to live server UUID
        run: |
          python - <<'PY'
          import os
          import time
          import pymysql

          for attempt in range(30):
              try:
                  connection = pymysql.connect(
                      host="127.0.0.1",
                      port=3306,
                      user="root",
                      autocommit=True,
                  )
                  break
              except pymysql.MySQLError:
                  if attempt == 29:
                      raise
                  time.sleep(1)
          with connection:
              with connection.cursor() as cursor:
                  cursor.execute("SELECT @@lower_case_table_names")
                  if int(cursor.fetchone()[0]) != 2:
                      raise RuntimeError(
                          "disposable MySQL must use lower_case_table_names=2"
                      )
                  cursor.execute("SELECT @@server_uuid")
                  server_uuid = str(cursor.fetchone()[0])
                  cursor.execute(
                      "CREATE DATABASE bfl_disposable_test_marker "
                      "CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci"
                  )
                  cursor.execute(
                      "CREATE TABLE bfl_disposable_test_marker.server_identity "
                      "(marker VARCHAR(64) NOT NULL, server_uuid VARCHAR(64) NOT NULL)"
                  )
                  cursor.execute(
                      "INSERT INTO bfl_disposable_test_marker.server_identity "
                      "(marker, server_uuid) VALUES (%s, %s)",
                      ("BOND_FACTOR_LAB_DISPOSABLE_TEST_MYSQL", server_uuid),
                  )
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              stream.write(
                  "BFL_TEST_MYSQL_ADMIN_URL="
                  "mysql+pymysql://root@127.0.0.1:3306/mysql\n"
              )
              stream.write(f"BFL_TEST_MYSQL_EXPECTED_SERVER_UUID={server_uuid}\n")
              stream.write("BFL_TEST_MYSQL_ALLOW_DATABASE_DDL=1\n")
          PY
      - run: python -B -m pytest -q --mysql-integration tests/integration
      - name: Stop disposable MySQL
        if: always()
        run: |
          if [[ -n "${BFL_CI_MYSQL_PREFIX:-}" ]]; then
            "$BFL_CI_MYSQL_PREFIX/bin/mysqladmin" \
              --host=127.0.0.1 --port=3306 --user=root shutdown \
              >/dev/null 2>&1 || true
          fi
          if [[ -n "${BFL_CI_MYSQL_PID:-}" && -f "$BFL_CI_MYSQL_PID" ]]; then
            kill "$(cat "$BFL_CI_MYSQL_PID")" 2>/dev/null || true
          fi

  release-contents:
    name: Deterministic release contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-service.txt
            requirements-test.txt
      - run: python -m pip install -r requirements-service.txt -r requirements-test.txt
      - run: python -B -m pytest -q tests/test_source_release_tools.py tests/test_launchd_release_launcher.py
      - name: Build clean candidate archive
        run: |
          release_dir="$(mktemp -d)"
          python -B scripts/build_source_release.py --project-root . --output-dir "$release_dir"
