# Bond Project Pro - public HTTPS entry for test.finailab.cn
#
# Chain:
#   https://test.finailab.cn/
#     -> public Nginx on 101.132.143.185
#     -> 127.0.0.1:18080
#     -> SSH reverse tunnel
#     -> Mac 127.0.0.1:80
#     -> local Homebrew Nginx
#     -> static frontend + /bondInvestment Java backend

upstream bondprojectpro_local_nginx {
    server 127.0.0.1:18080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name test.finailab.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name test.finailab.cn;

    ssl_certificate     /etc/letsencrypt/live/test.finailab.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.finailab.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/bondprojectpro-test.access.log;
    error_log  /var/log/nginx/bondprojectpro-test.error.log;

    client_max_body_size 1024m;

    location ^~ /bondInvestment/websocket {
        proxy_pass http://bondprojectpro_local_nginx;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_connect_timeout 60s;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_redirect        off;
    }

    location / {
        proxy_pass http://bondprojectpro_local_nginx;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 10s;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_redirect http://$host/ https://$host/;
        proxy_redirect http://localhost/ https://$host/;
    }
}
