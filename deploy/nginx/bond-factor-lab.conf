# Bond Factor Lab — 公网只读访问 Nginx 入口配置
# =============================================================================
# 部署位置（公网入口机）：
#   /etc/nginx/sites-available/bond-factor-lab
#   软链到 /etc/nginx/sites-enabled/bond-factor-lab
#   依赖：/etc/nginx/snippets/bond-proxy-headers.conf（见 deploy/nginx/snippets/）
# 应用：
#   sudo nginx -t && sudo systemctl reload nginx
#
# 链路：
#   https://bond.finailab.cn/bond-factor-lab/
#     -> 本配置（默认拒绝 + 展示白名单 + 前缀剥离）
#     -> proxy_pass http://127.0.0.1:18100
#     -> SSH 反向隧道
#     -> 本地 Mac 127.0.0.1:8100 (FastAPI)
#
# 落地 PRD（docs/product/PRD_PUBLIC_BOND_FACTOR_LAB_ACCESS.md）的 §6 访问控制模型：
#   - 默认拒绝（default-deny）：只放行展示页面渲染所必需的最小集合，其余一律 403。
#   - 展示白名单（GET）：/api/health、/api/schemes、/api/metrics/{id}、
#     /api/backtests/factor-lab，加前端页面与静态资源。
#   - 拒绝（403）：其余所有 /api/*（predictions/actuals/targets/backtests/runs*/
#     data-checks 等原始数据导出，以及 trigger / admin/registry/sync 写入接口）。
#
# Nginx location 匹配优先级（务必理解，否则白/黑名单会错位）：
#   1) 精确 `=`           —— 最高，命中即停。
#   2) 正则 `~` / `~*`    —— 按“书写先后顺序”匹配，第一个命中即停。
#   3) 普通前缀（无修饰） —— 最低，作为兜底。
#   因此：allow 的正则（metrics）必须写在 deny 的兜底正则之前；
#         前端页面用普通前缀兜底，绝不能用 `^~`（会抢在 api 正则之前命中）。
# =============================================================================

# ---- 后端上游（SSH 反向隧道在入口机本地暴露的端口）----
upstream bond_factor_lab_backend {
    server 127.0.0.1:18100;
    keepalive 16;
}

# =============================================================================
# HTTP :80 -> HTTPS 跳转（R4）
# 说明：若入口机已有统一的 80->443 跳转 server（或 certbot 已接管 80），
#       则删除本 server 块，避免与既有 default server 冲突，二选一。
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name bond.finailab.cn;

    return 301 https://$host$request_uri;
}

# =============================================================================
# HTTPS :443 主入口
# 说明：本文件只声明 /bond-factor-lab/ 子路径相关 location；TLS 证书、
#       server_name、根路径策略沿用入口机既有 443 server 配置。
#       如果灰度实验室是该域名上唯一服务，可直接用下面这个完整 server 块；
#       否则把 `location` 段并入既有 443 server，并复用其 ssl_* 指令。
# =============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bond.finailab.cn;

    # ---- TLS（按入口机实际证书路径填写；certbot 通常已生成）----
    ssl_certificate     /etc/letsencrypt/live/bond.finailab.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bond.finailab.cn/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;   # 如有则启用
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;     # 如有则启用

    # 默认拒绝：未匹配到下方 /bond-factor-lab 白名单的任何路径一律 403
    # （PRD §6「除白名单外一切路径 403」；根路径不交给灰度实验室）。
    # 注意：若本域名根路径还要服务其它内容，请勿整块套用本 server，
    #       而是把下面 /bond-factor-lab 段并入既有 443 server，保留其根策略。
    location / {
        return 403;
    }

    # -------------------------------------------------------------------------
    # 0) 补斜杠：/bond-factor-lab -> /bond-factor-lab/
    # -------------------------------------------------------------------------
    location = /bond-factor-lab {
        return 301 /bond-factor-lab/;
    }

    # -------------------------------------------------------------------------
    # 1) 展示白名单 —— 精确匹配的只读接口（GET）
    #    rewrite 剥离 /bond-factor-lab 前缀后转发到后端根路径（后端无 root_path）。
    # -------------------------------------------------------------------------
    location = /bond-factor-lab/api/health {
        limit_except GET HEAD { deny all; }
        rewrite ^/bond-factor-lab(/.*)$ $1 break;
        proxy_pass http://bond_factor_lab_backend;
        include snippets/bond-proxy-headers.conf;
    }

    location = /bond-factor-lab/api/schemes {
        limit_except GET HEAD { deny all; }
        rewrite ^/bond-factor-lab(/.*)$ $1 break;
        proxy_pass http://bond_factor_lab_backend;
        include snippets/bond-proxy-headers.conf;
    }

    location = /bond-factor-lab/api/backtests/factor-lab {
        limit_except GET HEAD { deny all; }
        rewrite ^/bond-factor-lab(/.*)$ $1 break;
        proxy_pass http://bond_factor_lab_backend;
        include snippets/bond-proxy-headers.conf;
    }

    # -------------------------------------------------------------------------
    # 2) 展示白名单 —— /api/metrics/{scheme_id}（正则；composite id 如 base__h1__7Y）
    #    必须写在下面 deny 兜底正则之前（正则按书写顺序匹配）。
    # -------------------------------------------------------------------------
    location ~ ^/bond-factor-lab/api/metrics/[^/]+$ {
        limit_except GET HEAD { deny all; }
        rewrite ^/bond-factor-lab(/.*)$ $1 break;
        proxy_pass http://bond_factor_lab_backend;
        include snippets/bond-proxy-headers.conf;
    }

    # -------------------------------------------------------------------------
    # 3) 拒绝兜底 —— 其余所有 /api/* 一律 403
    #    覆盖：predictions / actuals / targets / backtests/runs* /
    #          backtests/data-checks / schemes/{id}/trigger / admin/registry/sync
    #    `(/|$)` 同时兜住无尾斜杠的裸 /bond-factor-lab/api，避免它落到下面的
    #    页面前缀被转发到后端（PRD §6「除白名单外一切路径 403」）。
    # -------------------------------------------------------------------------
    location ~ ^/bond-factor-lab/api(/|$) {
        return 403;
    }

    # -------------------------------------------------------------------------
    # 4) 前端页面 + 静态资源（普通前缀，最低优先级兜底）
    #    命中 index.html、aifin-shell.js/.css、assets/* —— 它们不匹配上面的 api 正则。
    #    只允许 GET/HEAD（展示用），其余方法 403。
    # -------------------------------------------------------------------------
    location /bond-factor-lab/ {
        limit_except GET HEAD { deny all; }
        rewrite ^/bond-factor-lab(/.*)$ $1 break;
        proxy_pass http://bond_factor_lab_backend;
        include snippets/bond-proxy-headers.conf;
    }
}
