# Bond Factor Lab — 公网精确白名单入口
# BOND_FACTOR_PUBLIC_RELEASE_ID: 20260722b
# =============================================================================
# 部署位置（公网入口机）：
#   /etc/nginx/sites-available/bond-factor-lab
#   /etc/nginx/snippets/bond-proxy-headers-20260722b.conf
#
# 本文件是 sites-enabled 中由真实 nginx.conf 的 http {} include 的 site 文件，
# 因而 map、limit_*_zone、log_format 必须保持在 server {} 之外。它不是独立的
# nginx.conf，不要直接对本文件执行 `nginx -t -c`。
#
# 发布阶段是服务端常量，不读取 Host、header、cookie 或 query：
#   rollout -> dashboard 与旧 schemes/metrics/backtest 同时可达；
#   final   -> 只保留 dashboard，旧展示 API 返回 403。
# 原子切换和校验命令见 deploy/README.md。切换时只修改下一段 default 的字面值。
# =============================================================================

# BOND_FACTOR_RELEASE_STAGE: rollout | final
map $server_addr $bond_factor_release_stage {
    default rollout;
}

# 只审计原始 URI 的 path（第一个 ? 之前）：当前版本资源 query
# `?v=20260722a` 保持允许，但 path 中任何 %HH、双斜杠或单/双 dot segment
# 都在 Nginx 规范化和 location 匹配前 fail closed。
map $request_uri $bond_factor_unsafe_raw_path {
    default 0;
    ~*^[^?]*(?:%[0-9a-f][0-9a-f]|//) 1;
    ~*^[^?]*/(?:\.|\.\.)(?:/|\?|$) 1;
}

# 只记录固定枚举，不把可能含高基数或敏感内容的原始 User-Agent 写入日志。
map $http_user_agent $bond_factor_traffic_class {
    default user;
    "bond-factor-lab-access-check/1.0" access_check;
    "bond-factor-lab-api-benchmark/1.0" api_benchmark;
    "bond-factor-lab-browser-benchmark/1.0" browser_benchmark;
}

limit_req_zone $binary_remote_addr zone=bond_factor_dashboard:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=bond_factor_conn:10m;

# 不记录 query/header；记录安全的 timing、wire bytes、压缩和限流状态。
log_format bond_factor_timing '$request_id $remote_addr $bond_factor_traffic_class '
                              '"$request_method $uri $server_protocol" $status '
                              '$request_time $upstream_connect_time '
                              '$upstream_header_time $upstream_response_time '
                              '$body_bytes_sent $sent_http_content_encoding '
                              '$sent_http_vary $gzip_ratio $limit_req_status';

upstream bond_factor_lab_backend {
    server 127.0.0.1:18100;
    keepalive 16;
}

# HTTP -> HTTPS：Location 固定到 canonical host，禁止 Host header 注入。
server {
    listen 80;
    listen [::]:80;
    server_name bond.finailab.cn;

    if ($bond_factor_unsafe_raw_path) {
        return 403;
    }

    return 301 https://bond.finailab.cn$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bond.finailab.cn;

    ssl_certificate     /etc/letsencrypt/live/bond.finailab.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bond.finailab.cn/privkey.pem;

    access_log /var/log/nginx/bond-factor-lab-access.log bond_factor_timing;

    # 在 location 规范化前检查原始 request_uri。这里的 if 只执行 return，属于
    # Nginx rewrite 模块的安全用法。仅检查第一个 ? 之前的原始 path；query
    # 由各只读 API 自身契约校验。
    if ($bond_factor_unsafe_raw_path) {
        return 403;
    }

    # rollout 旧 backtest 基线可超过 3 秒，通用路径保留兼容预算；只有新
    # dashboard 的精确 location 使用 1s/3s 快速失败预算。
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_buffering on;

    # 默认拒绝未知页面、大小写/尾斜杠变体以及未列出的 API。
    location / {
        return 403;
    }

    location = /bond-factor-lab {
        return 301 https://bond.finailab.cn/bond-factor-lab/;
    }

    # 页面和静态文件全部精确列举，禁止 broad static proxy。
    location = /bond-factor-lab/ {
        limit_except GET HEAD { deny all; }
        rewrite ^/bond-factor-lab(/.*)$ $1 break;
        proxy_pass http://bond_factor_lab_backend;
        include snippets/bond-proxy-headers-20260722b.conf;
    }

    location = /bond-factor-lab/index.html {
        limit_except GET HEAD { deny all; }
        rewrite ^/bond-factor-lab(/.*)$ $1 break;
        proxy_pass http://bond_factor_lab_backend;
        include snippets/bond-proxy-headers-20260722b.conf;
    }

    location = /bond-factor-lab/aifin-shell.css {
        limit_except GET HEAD { deny all; }
        rewrite ^/bond-factor-lab(/.*)$ $1 break;
        proxy_pass http://bond_factor_lab_backend;
        include snippets/bond-proxy-headers-20260722b.conf;
    }

    location = /bond-factor-lab/aifin-shell.js {
        limit_except GET HEAD { deny all; }
        rewrite ^/bond-factor-lab(/.*)$ $1 break;
        proxy_pass http://bond_factor_lab_backend;
        include snippets/bond-proxy-headers-20260722b.conf;
    }

    location = /bond-factor-lab/assets/aifin-lab-icon.svg {
        limit_except GET HEAD { deny all; }
        rewrite ^/bond-factor-lab(/.*)$ $1 break;
        proxy_pass http://bond_factor_lab_backend;
        include snippets/bond-proxy-headers-20260722b.conf;
    }

    location = /bond-factor-lab/assets/aifin-lab-logo.svg {
        limit_except GET HEAD { deny all; }
        rewrite ^/bond-factor-lab(/.*)$ $1 break;
        proxy_pass http://bond_factor_lab_backend;
        include snippets/bond-proxy-headers-20260722b.conf;
    }

    # health 独立于 dashboard 限流，避免 dashboard 滥用拖垮健康检查。
    location = /bond-factor-lab/api/health {
        limit_except GET HEAD { deny all; }
        rewrite ^/bond-factor-lab(/.*)$ $1 break;
        proxy_pass http://bond_factor_lab_backend;
        include snippets/bond-proxy-headers-20260722b.conf;
    }

    # 新展示 API 必须是精确 location，并位于通用 API deny 之前。
    location = /bond-factor-lab/api/factor-lab/dashboard {
        limit_except GET HEAD { deny all; }
        limit_req zone=bond_factor_dashboard burst=20 nodelay;
        limit_req_status 429;
        limit_conn bond_factor_conn 20;
        limit_conn_status 429;
        proxy_connect_timeout 1s;
        proxy_read_timeout 3s;
        proxy_buffering on;

        # 后端在 SSH 隧道前完成 gzip-6；入口只透传，既不二次压缩也不解压。
        gzip off;
        gunzip off;

        rewrite ^/bond-factor-lab(/.*)$ $1 break;
        proxy_pass http://bond_factor_lab_backend;
        include snippets/bond-proxy-headers-20260722b.conf;
    }

    # rollout 兼容窗口。发布阶段切到 final 时，这三类 location 明确返回 403；
    # FastAPI 本机接口仍保留用于 harness 和回滚。
    location = /bond-factor-lab/api/schemes {
        if ($bond_factor_release_stage = final) { return 403; }
        limit_except GET HEAD { deny all; }
        rewrite ^/bond-factor-lab(/.*)$ $1 break;
        proxy_pass http://bond_factor_lab_backend;
        include snippets/bond-proxy-headers-20260722b.conf;
    }

    location = /bond-factor-lab/api/backtests/factor-lab {
        if ($bond_factor_release_stage = final) { return 403; }
        limit_except GET HEAD { deny all; }
        rewrite ^/bond-factor-lab(/.*)$ $1 break;
        proxy_pass http://bond_factor_lab_backend;
        include snippets/bond-proxy-headers-20260722b.conf;
    }

    location ~ ^/bond-factor-lab/api/metrics/[^/]+$ {
        if ($bond_factor_release_stage = final) { return 403; }
        limit_except GET HEAD { deny all; }
        rewrite ^/bond-factor-lab(/.*)$ $1 break;
        proxy_pass http://bond_factor_lab_backend;
        include snippets/bond-proxy-headers-20260722b.conf;
    }

    # 所有其余 API（含 docs/openapi、写接口、未知 API）fail closed。
    location ~ ^/bond-factor-lab/api(?:/|$) {
        return 403;
    }
}
