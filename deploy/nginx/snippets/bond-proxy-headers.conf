# Bond Factor Lab — 公网入口反向代理头部公共片段
#
# 部署位置（入口机）：/etc/nginx/snippets/bond-proxy-headers.conf
# 被 bond-factor-lab.conf 的各 location 以 `include snippets/bond-proxy-headers.conf;` 引用。
#
# 作用：把外部请求转发到 SSH 反向隧道暴露的本地后端（127.0.0.1:18100 -> 本地 Mac 8100）时，
#       透传必要的 Host / 客户端 IP / 协议信息，并启用 HTTP/1.1 长连接。

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection        "";

# 隧道偶发断开时不要长时间挂起客户端
proxy_connect_timeout 5s;
proxy_read_timeout    30s;
proxy_send_timeout    30s;
