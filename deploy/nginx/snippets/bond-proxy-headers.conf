# Bond Factor Lab — 公网入口反向代理公共头部
# release 20260722b 部署到不可变路径
# /etc/nginx/snippets/bond-proxy-headers-20260722b.conf，避免回滚旧 site 时串用新片段。

proxy_http_version 1.1;
proxy_set_header Host              bond.finailab.cn;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection        "";

# 后端在 SSH 隧道前协商压缩，入口保持原 Accept-Encoding 和 request ID。
proxy_set_header Accept-Encoding   $http_accept_encoding;
proxy_set_header X-Request-ID      $request_id;

# Vary 默认会被 proxy 模块透传；显式声明使协议合同可审计。
proxy_pass_header Vary;
