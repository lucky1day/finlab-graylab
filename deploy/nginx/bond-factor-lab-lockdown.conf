# Bond Factor Lab — authentication rollback lockdown replacement site
#
# This file replaces, and must never be enabled alongside,
# bond-factor-lab.conf. It keeps the public application prefix closed while
# an authentication release is repaired; it never proxies to a backend.

map $request_uri $bond_factor_lockdown_unsafe_raw_path {
    default 0;
    ~*^[^?]*(?:%[0-9a-f][0-9a-f]|//) 1;
    ~*^[^?]*/(?:\.|\.\.)(?:/|\?|$) 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name bond.finailab.cn;

    if ($bond_factor_lockdown_unsafe_raw_path) {
        return 403;
    }

    location = /bond-factor-lab { return 503; }
    location ^~ /bond-factor-lab/ { return 503; }
    location / { return 403; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bond.finailab.cn;

    ssl_certificate     /etc/letsencrypt/live/bond.finailab.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bond.finailab.cn/privkey.pem;

    if ($bond_factor_lockdown_unsafe_raw_path) {
        return 403;
    }

    location = /bond-factor-lab { return 503; }
    location ^~ /bond-factor-lab/ { return 503; }
    location / { return 403; }
}
