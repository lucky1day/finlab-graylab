# Bond Project Pro - ACME bootstrap for test.finailab.cn
#
# Deploy first, before the Let's Encrypt certificate exists:
#   /etc/nginx/sites-available/bondprojectpro-test
#   /etc/nginx/sites-enabled/bondprojectpro-test -> sites-available
#
# After certbot succeeds, replace this file with bondprojectpro-test.conf.

server {
    listen 80;
    listen [::]:80;
    server_name test.finailab.cn;

    access_log /var/log/nginx/bondprojectpro-test.access.log;
    error_log  /var/log/nginx/bondprojectpro-test.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
