scheme_id: weekly_10y_d_overlay
name: "0529周度10Y-D-overlay基准"
description: "weekly_10y_d_overlay_0529 原始周度10Y D-overlay方案；周六预测下一周最后一个交易日相对本周最后一个交易日的10Y方向。"
horizon: 6
tenors: ["10Y"]
frequency: weekly
schedule:
  cron: "30 11 * * 6"
  timezone: "Asia/Shanghai"
entry_point: predict.run
status: active
target_rule: next_week_last_trading_day_vs_current_week_last_trading_day
input_spec:
  data_version: shared_data_service_weekly.v1
  weekly_variant: unified
  required_columns: ["week_id", "TB0YWI3C", "TB1YWI3C", "TB5YWI3C"]
backtest:
  runner: backtests.weekly_10y_d_overlay_reproduction
